<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tip-Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculator">

        <h1>Calculadora de propinas</h1>

        <p class="description">
            Calcula la propina y divide la cuenta entre varias personas.
        </p>

        <div class="input-group">
            <label for="bill">Monto de la cuenta</label>
            <input type="number" id="bill" min="0">
        </div>

        <div class="input-group">
    <label for="tip">Porcentaje de propina</label>

    <div class="tip-options">
        <button type="button" class="tip-button" data-tip="10">10%</button>
        <button type="button" class="tip-button" data-tip="15">15%</button>
        <button type="button" class="tip-button" data-tip="20">20%</button>
    </div>

    <input type="number" id="tip" min="0" >
</div>

        <div class="input-group">
            <label for="people">Número de personas</label>
            <input type="number" id="people" min="1" step="1" >
        </div>

        <button id="calculate">Calcular</button>

        <p id="errorMessage" class="error-message"></p>

        <div id="results">
            <h2>Resumen</h2>

            <p>Propina <span id="tipResult">$0</span></p>
            <p>Total <span id="totalResult">$0</span></p>
            <p>Por persona <span id="personResult">$0</span></p>
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
