<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip-Calculator</title>
</head>
<body>
    <!-- Titulo -->
    <h1>Calculadora de propinas</h1>
<!--Contenedor de la calculadora-->
<p>Calcula la propina y divide la cuenta entre varias personas.</p>   
<label for="bill">Monto de la cuenta:</label>
<input type="number" id="bill" placeholder="Ej: 25000"> <!-- monto de la cuenta usuario -->

<br><br> <!-- salto de linea -->

<label for="tip">Porcentaje de propina:</label> <!-- etiqueta para el porcentaje de propina -->
<input type="number" id="tip" placeholder="Ej: 10"> <!-- input para el porcentaje de propina -->

<br><br>

<label for="people">Número de personas:</label> <!-- etiqueta para el número de personas -->
<input type="number" id="people" placeholder="Ej: 2"> <!-- input para el número de personas -->

<br><br>

<button>Calcular</button> <!-- boton para calcular la propina -->

</body>
</html>
